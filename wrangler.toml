name = "free-tv"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

main = "./cloudflare-worker.ts"
minify = true

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "free-tv"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"

[[durable_objects.bindings]]
name = "WATCH_ROOM"
class_name = "WatchRoomHub"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["WatchRoomHub"]

[triggers]
crons = ["0 1 * * *"]

[vars]
NODE_ENV = "production"
BUILD_TARGET = "cloudflare"
CRON_WAIT_FOR_COMPLETION = "true"
